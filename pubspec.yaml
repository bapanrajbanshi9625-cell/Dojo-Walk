name: dojo_walk
description: Dojo Walk - Dog walking app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ==========================================================
  # FIREBASE
  # ==========================================================

  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5

  # ==========================================================
  # LOCAL STORAGE / LOGIN STATE
  # ==========================================================

  shared_preferences: ^2.2.3

  # ==========================================================
  # NETWORK
  # ==========================================================

  connectivity_plus: ^6.1.4

  # ==========================================================
  # PHONE CALL / SMS
  # ==========================================================

  url_launcher: ^6.3.2

  # ==========================================================
  # QR CODE GENERATION
  # ==========================================================

  qr_flutter: ^4.1.0

  # ==========================================================
  # QR CODE SCANNER
  # ==========================================================

  mobile_scanner: ^5.1.0

  # ==========================================================
  # PROFILE / PET PHOTOS
  # ==========================================================

  image_picker: ^1.1.2

  # ==========================================================
  # OPENSTREETMAP
  # ==========================================================

  flutter_map: ^8.3.1

  # ==========================================================
  # GPS / CURRENT LOCATION
  # ==========================================================

  geolocator: ^12.0.0

  # ==========================================================
  # GPS -> READABLE ADDRESS
  # ==========================================================

  geocoding: ^5.0.0

  # ==========================================================
  # MSG91 OTP
  # ==========================================================

  sendotp_flutter_sdk: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1

# ==========================================================
# APP ICON CONFIGURATION
# ==========================================================

flutter_launcher_icons:
  image_path: "assets/DOJO_WALK.png"
  android: true
  ios: false

# ==========================================================
# FLUTTER
# ==========================================================

flutter:
  uses-material-design: true

  assets:
    - assets/DOJO_WALK.png
    - assets/Dojo_splash.png
    - assets/dog_welcome.png
